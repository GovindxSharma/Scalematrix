name: PulseScale Monolith Production CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Type Check & Static Code Analysis
  typecheck:
    name: TypeScript & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            01-monolith/backend/package-lock.json
            01-monolith/frontend/package-lock.json

      - name: Typecheck Backend
        working-directory: 01-monolith/backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      - name: Typecheck & Build Frontend
        working-directory: 01-monolith/frontend
        run: |
          npm ci
          npm run build

  # 2. Concurrency, Race Condition & Integration Tests
  test:
    name: Concurrency & Integration Tests
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pulsescale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Backend Concurrency Tests
        working-directory: 01-monolith/backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/pulsescale_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-123456
        run: |
          npm ci
          npx prisma db push
          npm run test:concurrency

  # 3. Production Docker Container Build Verification
  docker-build:
    name: Docker Image Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: 01-monolith/backend
          file: 01-monolith/docker/Dockerfile.backend
          push: false
          tags: pulsescale/backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: 01-monolith/frontend
          file: 01-monolith/docker/Dockerfile.frontend
          push: false
          tags: pulsescale/frontend:latest
