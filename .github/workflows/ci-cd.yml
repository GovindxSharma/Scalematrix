name: ScaleMatrix CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Syntax & Dependency Validation
  validate:
    name: Syntax & Code Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate JavaScript Syntax
        run: |
          node --check server.js test.js benchmark-suite.js \
            01-monolith/app.js 01-monolith/server.js \
            02-modular-monolith/app.js 02-modular-monolith/server.js 02-modular-monolith/modules/*.js \
            03-microservices/app.js 03-microservices/gateway.js 03-microservices/services/*.js 03-microservices/start-all.js

  # 2. Automated Test Suite
  test:
    name: Architecture & Sizing Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test
